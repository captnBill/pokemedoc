spring.application.name=pokemedoc
server.port=${PORT:8080}

# --- i18n (EN default, FR via ?lang=fr) ---
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# --- Local dev database: H2 file (persists between restarts, ignored by git) ---
spring.datasource.url=jdbc:h2:file:./data/pokemedoc;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Outgoing HTTP timeouts (Spring Boot 3.4+ property names) ---
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=10s

# --- External APIs ---
pokemedoc.pokeapi.base-url=https://pokeapi.co/api/v2
pokemedoc.rxterms.base-url=https://clinicaltables.nlm.nih.gov/api/rxterms/v3
# Max results requested per RxTerms search
pokemedoc.rxterms.count=200

# --- Drug name cache tuning ---
# Below this many cached names, every question first fetches a fresh 2-letter prefix.
pokemedoc.drugs.min-pool-size=200
# Once the pool is big enough, this fraction of questions still fetch a new prefix to keep growing it.
pokemedoc.drugs.refresh-chance=0.05

# --- Medicine illustrations (Wikimedia Commons photo search, then Wikipedia article; free, no key) ---
pokemedoc.images.enabled=true
pokemedoc.images.thumbnail-size=320
# How many Commons files to examine per medicine
pokemedoc.images.search-limit=30
# Commons search; {name} is the medicine. Only files with the name in their file name, no SVG drawings.
pokemedoc.images.query-template=intitle:"{name}" filetype:bitmap
# If Commons finds nothing, try the Wikipedia article (verified to be about a medicine; molecule images skipped)
pokemedoc.images.wikipedia-fallback=true
# Last resort when the verified article has no photo: allow its chemical structure drawing (lowest priority)
pokemedoc.images.molecule-fallback=true
# Minimum confidence (Commons search): 3 = a medicine word in the file name OR a medicine category; 6 = both. Higher = fewer, safer images.
pokemedoc.images.min-score=3
# Wikimedia asks for a descriptive User-Agent with contact info, e.g. "Pokemedoc/1.0 (you@example.com)"
pokemedoc.http.user-agent=Pokemedoc/1.0 (hobby project, jtmmonsieurmiche@gmail.com)
# To see why each image was accepted or rejected, uncomment:
# logging.level.com.example.pokemedoc.api=DEBUG
