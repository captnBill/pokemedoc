<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(#{register.title})}"></head>
<body>
  <header class="topbar">
    <a class="btn" th:href="@{/}" th:text="#{back.button}">Back</a>
  </header>
  <main class="form-page">
    <h1 th:text="#{register.title}">Create an account</h1>
    <p class="notice error" th:if="${error != null}" th:text="#{${error}}">Error</p>
    <form th:action="@{/register}" method="post">
      <label><span th:text="#{login.username}">Username</span>
        <input type="text" name="username" th:value="${username}" autocomplete="username"
               required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" autofocus></label>
      <label><span th:text="#{login.password}">Password</span>
        <input type="password" name="password" autocomplete="new-password" required minlength="8"></label>
      <p class="hint" th:text="#{register.hint}">Hint</p>
      <button type="submit" class="btn" th:text="#{register.button}">Register</button>
    </form>
    <p class="alt"><span th:text="#{register.haveaccount}">Already have an account?</span>
      <a th:href="@{/login}" th:text="#{auth.login}">Log in</a></p>
  </main>
</body>
</html>
